[package]
name = "simple-coords"
version = "0.1.0"
edition = "2024"
description = "A minimal coordinates HUD for Horizon: X, Y and Z on one line, nothing else"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { git = "https://github.com/horizon-rust/horizon" }

[profile.release]
opt-level = "s"
lto = true
